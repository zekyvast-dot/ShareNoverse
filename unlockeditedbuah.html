<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock</title>

    <!-- Adsterra Popunder & Social Bar -->
   <script src="https://accumulaterehearsehealing.com/af/48/1d/af481d2324aca0e94760fa5b1d337715.js"></script>
<script src="https://accumulaterehearsehealing.com/b9/a6/db/b9a6dbed0d09f60e6a75b92d00f6b44e.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
        }

        .card {
            background: #151515;
            border: 1px solid rgba(255, 0, 0, .2);
            border-radius: 18px;
            padding: 30px;
            text-align: center;
        }

        .lock {
            font-size: 50px;
            color: #ff1a1a;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            margin-top: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
            font-size: 14px;
        }

        .yt {
            background: #ff1a1a;
            color: white;
        }

        .yt:hover {
            background: #ff3333;
        }

        .yt:disabled {
            background: #333;
            color: #666;
            cursor: default;
        }

        .unlock {
            background: #222;
            color: #777;
            pointer-events: none;
        }

        .unlock.active {
            background: #00b140;
            color: white;
            pointer-events: auto;
        }

        .progress {
            width: 100%;
            height: 5px;
            background: #222;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 20px;
        }

        .bar {
            width: 0%;
            height: 100%;
            background: #ff1a1a;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="lock">
            <i class="fas fa-lock" id="lockIcon"></i>
        </div>

        <h2>Verification Required</h2>
        <p>Subscribe dulu buat unlock download.</p>

        <button class="btn yt" id="subBtn">
            <i class="fab fa-youtube"></i>
            SUBSCRIBE
        </button>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <button class="btn unlock" id="unlockBtn">
            <i class="fas fa-download"></i>
            UNLOCK DOWNLOAD
        </button>

    </div>
</div>

<script>
    const subBtn = document.getElementById("subBtn");
    const unlockBtn = document.getElementById("unlockBtn");
    const bar = document.getElementById("bar");
    const lockIcon = document.getElementById("lockIcon");

    let isSubscribed = false;

    subBtn.addEventListener("click", function() {
        if (isSubscribed) return;
        isSubscribed = true;

        // Langsung ke YouTube
        window.open("https://www.youtube.com/@ShareNover?sub_confirmation=1", "_blank");

        subBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFYING...';
        subBtn.disabled = true;

        let progress = 0;
        const intv = setInterval(() => {
            progress += Math.random() * 15 + 8;

            if (progress >= 100) {
                progress = 100;
                clearInterval(intv);

                unlockBtn.classList.add("active");
                lockIcon.classList.remove("fa-lock");
                lockIcon.classList.add("fa-lock-open");
                lockIcon.style.color = "#00b140";

                subBtn.innerHTML = '<i class="fas fa-check"></i> VERIFIED';
            }

            bar.style.width = progress + "%";
        }, 200);
    });

    unlockBtn.addEventListener("click", function() {
        if (!unlockBtn.classList.contains("active")) return;

        // Adsterra popunder otomatis dari script head
        // Delay biar popunder dulu, baru ke link download
        setTimeout(() => {
            window.open("https://link.adsafelink.com/lz7wKy", "_blank");
        }, 600);
    });
</script>

</body>
</html>
